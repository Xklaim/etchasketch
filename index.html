<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Etch-a-sketch</title>
</head>
<body>
    <h2 class="logo">Etch-a-sketch</h2>

    <div class="controls">
    <input title= "square count" placeholder="Enter Squares count on each side" type="number" id="numberInput" />
    <button title= "square count button" class="squareCountBtn button"><i class="fa-solid fa-border-all"></i></button>
    <button title= "Draw Button" class="drawBtn button"><i class="fa-solid fa-paintbrush"></i></button>
    <button title= "Erase Button" class="eraseBtn button"><i class="fa-solid fa-eraser"></i></button>
    <button title= "Random Color Button" class="randomColor button"><i class="fa-solid fa-dice"></i></button>
    <input title="Color Picker" type="color" class="colorPicker">


    </div>

    <div class="container" id="container"></div>



    <script src="script.js"></script>
</body>
</html>
